# A single-level gallery with a rich adjacency graph: every room opens off the foyer, and the
# galleries, shop and cafe are also chained to each other. The candidate brief for the
# rectangular-dual enumerator (docs/2026-09-14_STRETCH_GOALS_DESIGN.md).
# With a 22 x 18 envelope the chain a-c-d-b must sit in one 22 m row: CP-SAT finds it, the beam
# never does (0 of 8 verified, seed 0). At 26 x 20 both generators succeed.
name: gallery_rich
levels: 1
level_height: 4
envelope: {w: 26, l: 20, h: 4}
circulation:
  corridor: {w: 3, l: 12}
spaces:
  - {name: gallery_a, w: 6, l: 6, h: 4, program: room}
  - {name: gallery_b, w: 6, l: 6, h: 4, program: room}
  - {name: gallery_c, w: 5, l: 6, h: 4, program: room}
  - {name: gallery_d, w: 5, l: 6, h: 4, program: room}
  - {name: shop, w: 4, l: 4, h: 4, program: room, wishes: {exterior: true}}
  - {name: cafe, w: 5, l: 4, h: 4, program: room, wishes: {exterior: true}}
  - {name: wc, w: 2.5, l: 3, h: 4, program: room}
  - {name: store, w: 3, l: 3, h: 4, program: room}
contacts:
  - [corridor_0, gallery_a]
  - [corridor_0, gallery_b]
  - [corridor_0, gallery_c]
  - [corridor_0, gallery_d]
  - [corridor_0, shop]
  - [corridor_0, cafe]
  - [corridor_0, wc]
  - [corridor_0, store]
  - [gallery_a, gallery_c, {door: true}]
  - [gallery_b, gallery_d, {door: true}]
  - [gallery_c, gallery_d, {door: true}]
  - [shop, cafe, {door: true}]
  - [cafe, store, {door: true}]
