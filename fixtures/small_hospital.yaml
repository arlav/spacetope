# A small two-level hospital, 51 spaces after expansion: emergency, imaging, laboratory and pharmacy
# on the ground level, a twelve-bed ward above, wide doors (1.2 m rooms, 1.4 m bed lift), two stairs
# and a bed lift. Written to find where the beam and CP-SAT run out of steam (design note D.1).
# Measured 2026-09-14, seed 0: beam 0 of 8 verified (rooms with a corridor contact and a room door,
# such as emergency_reception, end up off the corridor); CP-SAT feasible in 60 s with one solve and
# a 300 s budget, nothing at the UI default of 60 s across 8 solves. Level frontage is at 92 % of a
# straight double-loaded corridor, so this brief wants a second corridor (design note E).
