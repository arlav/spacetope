# Four identical residential levels: two flats per level off a short landing, one stair and one
# lift through all four levels. Exercises stacking and the floor-count search.
name: apartments_four_levels
levels: 4
level_height: 3
envelope: {w: 18, l: 14, h: 12}
circulation:
  corridor: {w: 1.8, l: 6}
  stairs:
    - {name: stair, w: 3, l: 5.5}
  lifts:
    - {name: lift, w: 2.4, l: 2.4}
spaces:
  - {name: flat_a0, w: 7, l: 6, h: 3, program: room, wishes: {level: 0, exterior: true}}
  - {name: flat_b0, w: 7, l: 6, h: 3, program: room, wishes: {level: 0, exterior: true}}
  - {name: flat_a1, w: 7, l: 6, h: 3, program: room, wishes: {level: 1, exterior: true}}
  - {name: flat_b1, w: 7, l: 6, h: 3, program: room, wishes: {level: 1, exterior: true}}
  - {name: flat_a2, w: 7, l: 6, h: 3, program: room, wishes: {level: 2, exterior: true}}
  - {name: flat_b2, w: 7, l: 6, h: 3, program: room, wishes: {level: 2, exterior: true}}
  - {name: flat_a3, w: 7, l: 6, h: 3, program: room, wishes: {level: 3, exterior: true}}
  - {name: flat_b3, w: 7, l: 6, h: 3, program: room, wishes: {level: 3, exterior: true}}
contacts:
  - [corridor_0, flat_a0]
  - [corridor_0, flat_b0]
  - [corridor_1, flat_a1]
  - [corridor_1, flat_b1]
  - [corridor_2, flat_a2]
  - [corridor_2, flat_b2]
  - [corridor_3, flat_a3]
  - [corridor_3, flat_b3]
