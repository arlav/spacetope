# A two-level school wing: three classrooms per level on a wide corridor, staff room below,
# library above, one stair and one lift serving both levels.
name: school_wing
levels: 2
level_height: 3.5
envelope: {w: 32, l: 18, h: 7}
circulation:
  corridor: {w: 2.4, l: 20}
  stairs:
    - {name: stair, w: 3, l: 5.5}
  lifts:
    - {name: lift, w: 2.4, l: 2.4}
spaces:
  - {name: class_1, w: 8, l: 7, h: 3.5, program: room, wishes: {level: 0, exterior: true}}
  - {name: class_2, w: 8, l: 7, h: 3.5, program: room, wishes: {level: 0, exterior: true}}
  - {name: class_3, w: 8, l: 7, h: 3.5, program: room, wishes: {level: 0, exterior: true}}
  - {name: staff, w: 6, l: 5, h: 3.5, program: room, wishes: {level: 0, exterior: true}}
  - {name: wc_0, w: 3, l: 5, h: 3.5, program: room, wishes: {level: 0}}
  - {name: class_4, w: 8, l: 7, h: 3.5, program: room, wishes: {level: 1, exterior: true}}
  - {name: class_5, w: 8, l: 7, h: 3.5, program: room, wishes: {level: 1, exterior: true}}
  - {name: class_6, w: 8, l: 7, h: 3.5, program: room, wishes: {level: 1, exterior: true}}
  - {name: library, w: 9, l: 7, h: 3.5, program: room, wishes: {level: 1, exterior: true}}
  - {name: wc_1, w: 3, l: 5, h: 3.5, program: room, wishes: {level: 1}}
contacts:
  - [corridor_0, class_1]
  - [corridor_0, class_2]
  - [corridor_0, class_3]
  - [corridor_0, staff]
  - [corridor_0, wc_0]
  - [corridor_1, class_4]
  - [corridor_1, class_5]
  - [corridor_1, class_6]
  - [corridor_1, library]
  - [corridor_1, wc_1]
