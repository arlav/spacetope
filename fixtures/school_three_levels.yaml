# A three-level secondary school, 64 spaces after expansion: 24 classrooms, two science labs with a
# shared prep room, art, music and IT with their stores, admin and dining on the ground level, two
# stairs and a lift. Written to find where the beam and CP-SAT run out of steam (design note D.1).
# Measured 2026-09-14, seed 0: beam 0 of 8 verified (the last small rooms find no corridor frontage);
# CP-SAT 4 of 4 verified in 245 s with a 300 s budget (stacking 0.49), nothing at the UI default of
# 60 s. A 76 m envelope does not rescue the beam. Level frontage is at 88 % of a straight corridor.
